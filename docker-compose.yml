version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: securechainflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: securechainflow
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securechainflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - FRONTEND_ORIGIN=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/securechainflow
      - JWT_SECRET=dev_jwt_secret_key_securechainflow_2026
      - AI_SERVICE_URL=http://ai-service:8000
      - FABRIC_USE_MOCK_GATEWAY=true
    depends_on:
      - mongodb
      - ai-service

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: securechainflow-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securechainflow-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  mongo-data:
